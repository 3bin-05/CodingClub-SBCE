<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSE SBCE Coding Club</title>
    <script>
      // SPA redirect: encode the current path into a query param and redirect to root.
      // The main app (index.html) will decode it and navigate to the correct route.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
